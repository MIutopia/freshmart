spring:
  application:
    name: freshmart-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/freshmart?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci}
    username: ${DB_USERNAME:freshmart}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
storage:
  datasource:
    user:
      url: ${USER_DB_URL:jdbc:mysql://127.0.0.1:3307/freshmart_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci}
      username: ${USER_DB_USERNAME:${DB_USERNAME:freshmart}}
      password: ${USER_DB_PASSWORD:${DB_PASSWORD:}}
      hikari:
        maximum-pool-size: ${USER_DB_POOL_SIZE:5}
    merchant:
      url: ${MERCHANT_DB_URL:jdbc:mysql://127.0.0.1:3307/freshmart_merchant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci}
      username: ${MERCHANT_DB_USERNAME:${DB_USERNAME:freshmart}}
      password: ${MERCHANT_DB_PASSWORD:${DB_PASSWORD:}}
      hikari:
        maximum-pool-size: ${MERCHANT_DB_POOL_SIZE:5}
    delivery:
      url: ${DELIVERY_DB_URL:jdbc:mysql://127.0.0.1:3307/freshmart_delivery?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci}
      username: ${DELIVERY_DB_USERNAME:${DB_USERNAME:freshmart}}
      password: ${DELIVERY_DB_PASSWORD:${DB_PASSWORD:}}
      hikari:
        maximum-pool-size: ${DELIVERY_DB_POOL_SIZE:3}
    log:
      url: ${LOG_DB_URL:jdbc:mysql://127.0.0.1:3307/freshmart_log?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectionCollation=utf8mb4_unicode_ci}
      username: ${LOG_DB_USERNAME:${DB_USERNAME:freshmart}}
      password: ${LOG_DB_PASSWORD:${DB_PASSWORD:}}
      hikari:
        maximum-pool-size: ${LOG_DB_POOL_SIZE:3}
server:
  port: ${SERVER_PORT:8080}
auth:
  session-hours: ${AUTH_SESSION_HOURS:8}
management:
  endpoints:
    web:
      exposure:
        include: health,info
ai:
  gateway:
    base-url: ${AI_GATEWAY_BASE_URL:http://localhost:8090}
commerce:
  capacity:
    daily-order-target: ${CAPACITY_DAILY_ORDER_TARGET:50}
    concurrent-user-target: ${CAPACITY_CONCURRENT_USER_TARGET:20}
  media:
    max-size-bytes: ${MEDIA_MAX_SIZE_BYTES:31457280}
  batch:
    near-expiry-days: ${BATCH_NEAR_EXPIRY_DAYS:3}
  inventory-reservation-minutes: ${INVENTORY_RESERVATION_MINUTES:15}
  freight:
    free-threshold: ${FREIGHT_FREE_THRESHOLD:59.00}
    standard-fee: ${FREIGHT_STANDARD_FEE:6.00}
  weighing:
    platform-absorb-limit: ${WEIGHING_ABSORB_LIMIT:1.50}
  payment:
    provider: ${PAYMENT_PROVIDER:SIMULATED}
    mode: ${PAYMENT_MODE:SIMULATED}
  notification:
    seasonal-card-channel: INBOX
  authentication:
    mode: PASSWORD
  market-price:
    max-markup-rate: ${MARKET_PRICE_MAX_MARKUP_RATE:5.00}
  commission:
    default-rate: ${PLATFORM_COMMISSION_RATE:10.00}
  refund:
    default-window-minutes: ${REFUND_DEFAULT_WINDOW_MINUTES:1440}
