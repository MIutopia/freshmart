name: CI and CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshmart-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verify
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: freshmart_ci
          MYSQL_ROOT_PASSWORD: freshmart_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pfreshmart_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify backend
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Verify Flyway migrations and application health
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/freshmart_ci?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
          DB_USERNAME: root
          DB_PASSWORD: freshmart_ci
        run: |
          mvn --batch-mode --no-transfer-progress spring-boot:run > application.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health; then
              exit 0
            fi
            sleep 5
          done
          cat application.log
          exit 1
      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/freshmart-backend-*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Package static assets
        run: tar -czf frontend-dist.tar.gz -C dist .
      - name: Upload frontend package
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/frontend-dist.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'http://127.0.0.1:8080/actuator/health' }}
    steps:
      - name: Validate deployment configuration
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SERVICE"
          case "$DEPLOY_PATH" in /*) ;; *) echo "DEPLOY_PATH must be absolute"; exit 1;; esac
      - name: Download backend package
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: deploy
      - name: Download frontend package
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: deploy
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload release artifacts
        env:
          RELEASE_PATH: ${{ vars.DEPLOY_PATH }}/releases/${{ github.sha }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$RELEASE_PATH/frontend'"
          scp -P "$DEPLOY_PORT" deploy/freshmart-backend-*.jar deploy/frontend-dist.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$RELEASE_PATH/"
      - name: Activate release and verify health
        env:
          RELEASE_PATH: ${{ vars.DEPLOY_PATH }}/releases/${{ github.sha }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "tar -xzf '$RELEASE_PATH/frontend-dist.tar.gz' -C '$RELEASE_PATH/frontend' && \
             rm '$RELEASE_PATH/frontend-dist.tar.gz' && \
             mv '$RELEASE_PATH'/freshmart-backend-*.jar '$RELEASE_PATH/backend.jar' && \
             ln -sfn '$RELEASE_PATH' '$DEPLOY_PATH/current' && \
             sudo systemctl restart '$DEPLOY_SERVICE' && \
             attempt=1; while [ \$attempt -le 12 ]; do curl --fail --silent --show-error '$DEPLOY_HEALTH_URL' && exit 0; sleep 5; attempt=\$((attempt + 1)); done; exit 1"
